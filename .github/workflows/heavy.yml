name: heavy

# The two long runs: the slow suite, and the whole tree under the race detector
# three times on two CPUs (how a small machine behaves). Nightly on dev, on
# request, before a release builds, and from ci.yml on pull requests (race3
# for every pull request, the slow suite as well for those into main).
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (default dev)
        required: false
        default: dev
  workflow_call:
    inputs:
      which:
        description: slow, race3 or both (default both)
        type: string
        required: false
        default: both

permissions: {}

concurrency:
  group: heavy-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.x"
  GOTOOLCHAIN: local

jobs:
  slow:
    if: inputs.which != 'race3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # A release tag calls this from the release workflow, where github.ref is
      # the tag and is what to test; a schedule has the default branch's ref,
      # so it names dev; a dispatch takes its input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install ssh and tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openssh-client openssh-server tmux
          for bin in ssh scp ssh-keygen /usr/sbin/sshd tmux; do
            command -v "$bin" > /dev/null || { echo "::error::$bin is missing"; exit 1; }
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Download modules
        run: go mod download
      - name: Download modules of the pre-remote revision
        run: |
          rev="$(sed -n 's/^const preRemoteRev = "\([0-9a-f]*\)"$/\1/p' internal/remote/accept_test.go)"
          [ -n "$rev" ] || { echo "::error::preRemoteRev not found in internal/remote/accept_test.go"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/pre-remote" "$rev"
          (cd "$RUNNER_TEMP/pre-remote" && go mod download)
          git worktree remove --force "$RUNNER_TEMP/pre-remote"
      # One package at a time: these tests start real sshd and tmux and are
      # timing-sensitive when packages run side by side.
      - name: slow suite
        env:
          DEN_SLOW_TESTS: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
        run: XDG_STATE_HOME="$(mktemp -d)" go test -p 1 -count=1 -timeout 50m ./internal/remote ./internal/ui

  race3:
    if: inputs.which != 'slow'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Install ssh and tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openssh-client openssh-server tmux
          for bin in ssh scp ssh-keygen /usr/sbin/sshd tmux; do
            command -v "$bin" > /dev/null || { echo "::error::$bin is missing"; exit 1; }
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Download modules
        run: go mod download
      - name: Download modules of the pre-remote revision
        run: |
          rev="$(sed -n 's/^const preRemoteRev = "\([0-9a-f]*\)"$/\1/p' internal/remote/accept_test.go)"
          [ -n "$rev" ] || { echo "::error::preRemoteRev not found in internal/remote/accept_test.go"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/pre-remote" "$rev"
          (cd "$RUNNER_TEMP/pre-remote" && go mod download)
          git worktree remove --force "$RUNNER_TEMP/pre-remote"
      # Pinned to two CPUs, as the release gate runs it, so a race that only
      # shows on a small machine shows here too.
      - name: go test -race -count=3 on 2 CPUs
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
        run: |
          set -o pipefail
          XDG_STATE_HOME="$(mktemp -d)" taskset -c 0,1 go test -race -count=3 -timeout 100m -json ./... \
            | tee "$RUNNER_TEMP/race3.json" | jq -rj 'select(.Action=="output") | .Output'
      # Which tests failed, how many of the three counts each, and how many
      # data races were reported: in the job summary, and the whole record as
      # an artifact, so the nightly runs show how often each test fails.
      - name: Record the failures per test
        if: always()
        run: |
          f="$RUNNER_TEMP/race3.json"
          [ -s "$f" ] || { echo "no test record" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          {
            echo "### race x3 on 2 CPUs: $(jq -rs '[.[]|select(.Action=="pass" and .Test!=null)]|length' "$f") test passes, $(jq -rs '[.[]|select(.Action=="fail" and .Test!=null)]|length' "$f") test failures"
            echo "Data races reported: $(jq -rs '[.[]|select(.Action=="output" and ((.Output // "")|test("WARNING: DATA RACE")))]|length' "$f")"
            echo
            echo "| package | test | failed counts |"
            echo "| --- | --- | --- |"
            jq -rs '[.[]|select(.Action=="fail" and .Test!=null)|[.Package,.Test]]|group_by(.)|map({p:.[0][0],t:.[0][1],n:length})|sort_by(-.n)|.[]|"| \(.p) | \(.t) | \(.n) |"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -rs '[.[]|select(.Action=="fail" and .Test!=null)|[.Package,.Test]]|unique|.[]|@tsv' "$f" | head -20 | while IFS=$'\t' read -r pkg test; do
            echo "::group::$pkg $test"
            jq -r --arg p "$pkg" --arg t "$test" 'select(.Package==$p and .Test==$t and .Action=="output")|.Output' "$f" | head -80
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: race3-record
          path: ${{ runner.temp }}/race3.json
          if-no-files-found: ignore
          retention-days: 30
