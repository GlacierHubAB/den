name: release

# Runs only when a v* tag is pushed. Nothing else publishes. The tag must be an
# annotated semver tag on a commit that is already on main; see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.x"
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is vMAJOR.MINOR.PATCH[-PRERELEASE]
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a semantic version"
            exit 1
          fi
      # actions/checkout can turn an annotated tag into a lightweight one
      # locally, so ask the API what was pushed.
      - name: Tag is annotated
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; tag releases with git tag -a"
            exit 1
          fi
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release tags go on main only"
            exit 1
          fi

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # agent-badge is a submodule that Den embeds, so the build needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # No build cache for a release: nothing restored from another run
      # goes into the binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - name: make release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go version
          make release VERSION="$TAG"
      - name: Binaries report the tag, checksums match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          got=$(./dist/den_linux_amd64 version)
          if [ "$got" != "den $TAG" ]; then
            echo "::error::den_linux_amd64 version says '$got', want 'den $TAG'"
            exit 1
          fi
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job with write access. It runs no code from the repository: it
  # checks the files the build job made, attests them and creates the release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums match
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release notes are the tag's message followed by GitHub's
          # generated list of merged pull requests.
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message > notes.md
          echo >> notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body >> notes.md
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --notes-file notes.md "${prerelease[@]}" \
            dist/den_linux_amd64 dist/den_linux_arm64 dist/THIRD_PARTY_LICENSES dist/SHA256SUMS
