name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/den_linux_amd64
            dist/den_linux_arm64
            dist/SHA256SUMS
          generate_release_notes: true
