name: ci

# Pull requests into dev or main, pushes to dev and main, a weekly run on the
# default branch (new advisories for the Go version and modules Den ships),
# and the release workflow, which calls this one before it builds anything.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 4 * * 1"
  workflow_call:

# Every job asks for what it needs. Pull requests from forks get a read-only
# token and no secrets (this is pull_request, never pull_request_target).
permissions: {}

# A newer push to a pull request cancels its older run; every pushed commit on
# dev and main gets its own run. github.workflow is the caller's name when the
# release workflow calls this one, so the two never share a group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Go that builds the release. 1.26.x is the newest 1.26 patch, so
  # binaries pick up standard-library security fixes without a go.mod change.
  GO_VERSION: "1.26.x"
  GOTOOLCHAIN: local
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # agent-badge is a submodule that Den embeds, so the build needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::these files need gofmt -w"
            exit 1
          fi
      # A bidirectional control or a line/paragraph separator written literally
      # in a source file can make code read differently from what it does.
      # Tests that need one write it as an escape (\u202e), never raw.
      - name: no bidirectional controls or line separators in source
        env:
          LC_ALL: C.UTF-8
        run: |
          if git grep -nIP --recurse-submodules '[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{2028}\x{2029}\x{200E}\x{200F}\x{061C}]'; then
            echo "::error::raw bidi control or line separator found; write it as a \\u escape"
            exit 1
          fi
      - name: go.mod and go.sum are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify
      - name: THIRD_PARTY_LICENSES is up to date
        run: go run ./internal/tools/thirdparty -check
      # The release ships these two targets (see `make release`); CI otherwise
      # builds only for the runner's amd64, so a call that arm64 lacks
      # (syscall.Dup2) would first fail in the release build.
      - name: builds for every release target
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build ./...
          done
      - name: actionlint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The release Go, and the newest Go so a new release does not surprise us.
        go: ["1.26.x", "stable"]
    steps:
      # Full history: the remote acceptance tests build Den at earlier
      # revisions of this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      # The remote acceptance tests run a private sshd and tmux; they skip
      # when these are missing, so CI fails here instead of skipping there.
      - name: Install ssh and tmux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends openssh-client openssh-server tmux
          for bin in ssh scp ssh-keygen /usr/sbin/sshd tmux; do
            command -v "$bin" > /dev/null || { echo "::error::$bin is missing"; exit 1; }
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Download modules
        run: go mod download
      # Acceptance test 8 builds Den at the last commit before remote support
      # (preRemoteRev in internal/remote/accept_test.go), offline like the
      # rest; its go.mod pins older modules than this tree's.
      - name: Download modules of the pre-remote revision
        run: |
          rev="$(sed -n 's/^const preRemoteRev = "\([0-9a-f]*\)"$/\1/p' internal/remote/accept_test.go)"
          [ -n "$rev" ] || { echo "::error::preRemoteRev not found in internal/remote/accept_test.go"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/pre-remote" "$rev"
          (cd "$RUNNER_TEMP/pre-remote" && go mod download)
          git worktree remove --force "$RUNNER_TEMP/pre-remote"
      # The tests make their own git repositories and set their own identity,
      # and need no network: no global git config, no module proxy.
      - name: make test (vet, tests with -race)
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
        run: make test TESTFLAGS=-race
      - name: make build
        env:
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
        run: make build && ./den version
      # A parser of another process's bus messages: its seed corpus runs as a
      # plain test above, and this gives it 30 seconds of fuzzing as well.
      - name: fuzz the bus message parser for 30 seconds
        if: matrix.go == 'stable'
        env:
          GOPROXY: "off"
          GOFLAGS: -mod=readonly
        run: go test -run '^$' -fuzz FuzzReadMessage -fuzztime 30s ./internal/sysd/

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # go run module@version is checked against the Go checksum database.
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The released gitleaks binary, checked against a pinned checksum, rather
      # than another third-party action. --redact keeps any match out of the log.
      - name: gitleaks (whole history)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # Which files a pull request changes, to decide whether it also runs the slow
  # suite. If the file list cannot be read, the slow suite runs.
  paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      slow: ${{ steps.files.outputs.slow }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # The files API lists at most 3000 files.
          if [ "$CHANGED" -ge 3000 ]; then
            echo "slow=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            if printf '%s\n' "$files" | grep -Eq '^(internal/(remote|names|ui|fleet|sshtest)/|cmd/den/|go\.(mod|sum)$|\.github/workflows/(ci|heavy)\.yml$)'; then
              slow=true
            else
              slow=false
            fi
          else
            slow=true
          fi
          echo "slow=$slow" >> "$GITHUB_OUTPUT"

  # The race detector three times on two CPUs for every pull request, and the
  # slow suite as well for a pull request into main (a release) and for one that
  # changes internal/remote, internal/names, internal/ui, internal/fleet,
  # internal/sshtest, cmd/den, go.mod, go.sum or these two workflows. Orderings that only go
  # wrong on a small machine show here, not in a release, and the slow suite
  # drives the TUI over remote hosts, where the close, protect and resolver
  # logic is spread across those packages. Other events (a push, the weekly
  # run, the release workflow) skip it.
  heavy:
    if: github.event_name == 'pull_request'
    needs: [paths]
    permissions:
      contents: read
    uses: ./.github/workflows/heavy.yml
    with:
      which: ${{ (github.base_ref == 'main' || needs.paths.outputs.slow == 'true') && 'both' || 'race3' }}

  # The one check branch protection requires. Its name stays the same when
  # jobs or the matrix change; it fails unless every job above succeeded
  # (heavy and paths may also be skipped, on events they do not run for).
  ci-passed:
    if: always()
    needs: [lint, test, vuln, secrets, paths, heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.[]; .value.result == "success" or ((.key == "heavy" or .key == "paths") and .value.result == "skipped"))' > /dev/null
