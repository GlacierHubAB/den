name: Bug report
description: Den did something it should not, or did not do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove anything private from pasted output: paths, prompts, transcripts, session ids.
        Security problems go to the Security tab, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start den
        2. ...
  - type: textarea
    id: feedback
    attributes:
      label: den feedback
      description: |
        Output of `den feedback`: the setup checks of `den doctor`, versions, Den's own
        switches and counts from the last 7 days. It prints only fixed phrases, numbers
        and names from fixed lists, never your paths, prompts, agent names, sessions or
        hosts, and it withholds any line that still looks identifying. Read it before you
        paste: it goes into a public issue. Releases up to v0.6.1 do not have it; paste
        `den version` and `claude --version` below instead.
      render: text
  - type: input
    id: den-version
    attributes:
      label: den version
      description: Output of `den version`. Only needed if you could not paste `den feedback`.
  - type: input
    id: claude-version
    attributes:
      label: claude --version
      description: Only needed if you could not paste `den feedback`.
  - type: input
    id: environment
    attributes:
      label: Compositor and terminal
      placeholder: Hyprland 0.x, Ghostty 1.x
  - type: textarea
    id: details
    attributes:
      label: den list, den explain, hooks.log
      description: |
        If it is about one agent: `den list` and `den explain <name>` for it. If the inbox
        is involved: the relevant lines of `~/.local/state/den/hooks.log`. Unlike
        `den feedback`, these show your agents' names, projects and commands as they are,
        so read them and remove what you do not want public.
      render: text
