name: Bug report
description: Den did something it should not, or did not do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove anything private from pasted output: paths, prompts, transcripts, session ids.
        Security problems go to the Security tab, not here (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start den
        2. ...
  - type: textarea
    id: doctor
    attributes:
      label: den doctor
      description: |
        Output of `den doctor`. It only reads your setup and names no user, host, project,
        session or agent, so it is safe to paste. Releases up to v0.6.1 do not have it yet;
        leave this empty if your `den` says "unknown command".
      render: text
  - type: input
    id: den-version
    attributes:
      label: den version
      description: Output of `den version`.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: claude --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Compositor and terminal
      placeholder: Hyprland 0.x, Ghostty 1.x
  - type: textarea
    id: details
    attributes:
      label: den list, den explain, hooks.log
      description: |
        If it is about one agent: `den list` and `den explain <name>` for it. If the inbox
        is involved: the relevant lines of `~/.local/state/den/hooks.log`. These can name
        your agents and projects, so read them before you paste.
      render: text
