name: Question
description: How do I…, does Den…, or why does Den…
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The README's Troubleshooting section and `den doctor` answer the common setup
        questions. Remove anything private from pasted output.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you want to do, and what you tried.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: den doctor
      description: |
        If it is about your setup: output of `den doctor` (read it before you paste), or `den version`
        and `claude --version` on releases up to v0.6.1. If something went wrong rather than you
        asking how, `den feedback` gives us more, and is as safe to paste.
      render: text
